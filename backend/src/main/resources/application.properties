server.port=${PORT:8080}

# Database Configuration
# Defaults to embedded file-backed database with MySQL compatibility mode for zero-setup cloud deployments.
# When connecting to external MySQL, simply set DB_URL, DB_USERNAME, DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:file:./canteen_data;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT
app.jwt.secret=${JWT_SECRET:CampusCanteenPreOrderSystemSuperSecretKeyWithAtLeast256BitsOfSecurityTokens123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.campus.canteen=INFO
logging.level.org.springframework.security=WARN
