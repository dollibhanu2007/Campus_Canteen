server.port=8080

# Standalone File-Backed Database Mode (Zero external DB setup required)
spring.datasource.url=jdbc:h2:file:./canteen_data;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:CampusCanteenPreOrderSystemSuperSecretKeyWithAtLeast256BitsOfSecurityTokens123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

logging.level.com.campus.canteen=INFO
logging.level.org.springframework.security=WARN
