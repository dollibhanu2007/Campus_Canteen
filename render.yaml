services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Java 21 + Spring Boot 3)
  # -------------------------------------------------------------
  - type: web
    name: campus-canteen-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/menu
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: standalone
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # -------------------------------------------------------------
  # 2. React Vite Frontend Web App (Static Site)
  # -------------------------------------------------------------
  - type: static
    name: campus-canteen-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    plan: free
    region: oregon
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campus-canteen-backend
          property: host
